<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Prueba barra</title>
<style>
html{background:#0f0b08}body{margin:0;background:#0f0b08;color:#e9dcc0;font:18px/1.6 system-ui}
h1{font:400 64px/1 'Courier New',monospace;color:#d6aa4f;margin:90px 16px 10px}
p{margin:16px;max-width:40ch}
.bar{position:fixed;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#e9dcc0}
/* A: barra más alta, desplazada hacia arriba con top negativo (gradiente igual al original) */
body.a .bar{top:-120px;padding-top:132px;background:linear-gradient(rgba(15,11,8,.92) 120px,rgba(15,11,8,0))}
/* B: el relleno extra como hijo (lo que ya probamos) */
body.b .bar{top:0;background:linear-gradient(rgba(15,11,8,.92),rgba(15,11,8,0))}
body.b .bar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:240px;background:rgba(15,11,8,.92)}
.tag{position:fixed;bottom:12px;left:12px;right:12px;background:#d6aa4f;color:#000;padding:8px 12px;border-radius:8px;z-index:60;text-align:center;font:600 14px system-ui}
.tag a{color:#000}
</style></head>
<body class="a">
<header class="bar"><b>Bakersoft</b><span>Español ▾</span></header>
<h1>CRIMEOKU</h1>
<script>
var m=(location.search.match(/m=(a|b)/)||[])[1]||'a';document.body.className=m;
document.write('<div class="tag">Variante '+m.toUpperCase()+' · <a href="?m='+(m=='a'?'b':'a')+'">ver '+(m=='a'?'B':'A')+'</a></div>');
for(var i=0;i<40;i++)document.write('<p>Cada caso es una escena del crimen. Leé las pistas, ubicá a cada sospechoso en el mapa y descubrí quién fue el asesino.</p>');
</script>
</body></html>
